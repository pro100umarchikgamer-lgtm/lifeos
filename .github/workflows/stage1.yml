name: Offline Core validation and final signed test APK
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      focused:
        description: Run focused Flutter checks without full CI or APK
        type: boolean
        default: false
      build_apk:
        description: 'Build the final optimized test APK after all validation succeeds'
        type: boolean
        default: false
      force_full_validation:
        description: 'Run all mandatory checks even when identical inputs were already validated'
        type: boolean
        default: false
concurrency:
  group: lifeos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  focused:
    if: inputs.focused == true
    uses: ./.github/workflows/family-focused.yml
  checks:
    if: inputs.focused != true
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: bash tool/prepare_platforms.sh
      - run: flutter pub get
      - name: Validate CI and signing scripts
        run: |
          python3 -m py_compile tool/ci_validation.py
          bash -n tool/ci_signing.sh
      - name: Verify prior validation evidence and prevent duplicate APKs
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_APK: ${{ inputs.build_apk || false }}
          FORCE_FULL_VALIDATION: ${{ inputs.force_full_validation || false }}
        run: python3 tool/ci_validation.py
      - run: python3 -m unittest discover -s tool/tests -v
        if: steps.validation.outputs.full == 'true'
      - run: python3 -m unittest discover -s backend/tests -v
        if: steps.validation.outputs.full == 'true'
      - run: PYTHONPATH=. python3 tool/check_sync_protocol.py
        if: steps.validation.outputs.full == 'true'
      - run: python3 tool/validate_packs.py
        if: steps.validation.outputs.full == 'true'
      - run: flutter analyze
        if: steps.validation.outputs.full == 'true'
      - run: flutter test test/domain_test.dart test/calendar_test.dart test/financial_period_test.dart test/backup_test.dart test/appearance_test.dart test/controller_test.dart test/widget_test.dart test/offline_finance_test.dart test/wealth_test.dart test/statement_import_test.dart test/personal_modules_test.dart test/ux_recovery_test.dart
        if: steps.validation.outputs.full == 'true'
      - run: flutter test --update-goldens test/visual_snapshot_test.dart test/offline_visual_test.dart test/ux_recovery_visual_test.dart
        if: steps.validation.outputs.full == 'true'
      - run: python3 tool/verify_goldens.py
        if: steps.validation.outputs.full == 'true'
      - uses: actions/upload-artifact@v4
        if: always() && steps.validation.outputs.full == 'true'
        with:
          name: lifeos-ui-screenshots-${{ github.run_number }}
          path: test/goldens/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Compile native Android code without creating an APK
        if: steps.validation.outputs.full == 'true'
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Enable KVM for encrypted storage integration tests
        if: steps.validation.outputs.full == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: SQLCipher persistence, migrations and verified restore on Android emulator
        if: steps.validation.outputs.full == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: flutter test integration_test/offline_storage_test.dart integration_test/offline_expansion_test.dart integration_test/family_sync_storage_test.dart -d emulator-5554
      - name: Save evidence after all mandatory validation succeeds
        if: steps.validation.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-validation-proof
          path: validation-proof.json
          retention-days: 90
          if-no-files-found: error
      - name: Build and verify one APK with the persistent test identity
        if: steps.validation.outputs.build == 'true'
        env:
          LIFEOS_TEST_KEYSTORE_BASE64: ${{ secrets.LIFEOS_TEST_KEYSTORE_BASE64 }}
        run: bash tool/ci_signing.sh
      - name: Save public signing diagnostics on failure
        if: failure() && steps.validation.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-signing-diagnostics-${{ github.run_number }}
          path: apk-certificate.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload signed APK and public certificate evidence
        if: steps.validation.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-release-test-apk-${{ steps.validation.outputs.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            apk-identity.txt
            apk-certificate.txt
            apk-manifest.txt
          if-no-files-found: error
          retention-days: 90
