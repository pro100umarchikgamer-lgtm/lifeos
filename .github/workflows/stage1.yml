name: Offline Core validation and final signed test APK
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upgrade_probe:
        description: Verify retained APK upgrade UI automation without building any APK
        type: boolean
        default: false
      reuse_signed_apk:
        description: Verify the retained signed APK134001 without building another APK
        type: boolean
        default: false
      focused:
        description: Run focused Flutter checks without full CI or APK
        type: boolean
        default: false
      build_apk:
        description: 'Build the final optimized test APK after all validation succeeds'
        type: boolean
        default: false
      force_full_validation:
        description: 'Run all mandatory checks even when identical inputs were already validated'
        type: boolean
        default: false
concurrency:
  group: lifeos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  production_backend:
    if: inputs.upgrade_probe != true
    uses: ./.github/workflows/backend-production.yml
  focused:
    needs: production_backend
    if: inputs.focused == true || ((github.ref == 'refs/heads/feature/uladim-control-release' || github.ref == 'refs/heads/feature/uladim-ux-recovery-launch' || github.ref == 'refs/heads/feature/uladim-brand' || github.ref == 'refs/heads/feature/family-sync' || github.ref == 'refs/heads/feature/lifeos-3-ux-recovery') && github.event_name != 'workflow_dispatch' && inputs.build_apk != true)
    uses: ./.github/workflows/family-focused.yml
  checks:
    needs: production_backend
    if: inputs.focused != true && (github.event_name == 'workflow_dispatch' || (github.ref != 'refs/heads/feature/uladim-control-release' && github.ref != 'refs/heads/feature/uladim-ux-recovery-launch' && github.ref != 'refs/heads/feature/uladim-brand' && github.ref != 'refs/heads/feature/family-sync' && github.ref != 'refs/heads/feature/lifeos-3-ux-recovery') || inputs.build_apk == true)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lifeos_test
          POSTGRES_PASSWORD: synthetic-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifeos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LIFEOS_TEST_DATABASE_URL: postgresql://lifeos_ci:synthetic-ci-only-password@localhost:5432/lifeos_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact release source and Git history
        if: inputs.build_apk == true
        run: |
          mkdir -p source-recovery
          git bundle create source-recovery/ULADIM.bundle HEAD
          git format-patch --stdout e12609e5168683c4fafae6acea2d3c9ed445c57c..HEAD > source-recovery/ULADIM.patch
          git archive --format=zip --output=source-recovery/ULADIM-source.zip HEAD
          git rev-parse HEAD > source-recovery/COMMIT.txt
          (cd source-recovery && sha256sum ULADIM.bundle ULADIM.patch ULADIM-source.zip COMMIT.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: inputs.build_apk == true
        with:
          name: uladim-source-recovery
          path: source-recovery/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: bash tool/prepare_platforms.sh
      - run: flutter pub get
      - name: Validate CI and signing scripts
        run: |
          python3 -m py_compile tool/ci_validation.py
          bash -n tool/ci_signing.sh
      - name: Verify prior validation evidence and prevent duplicate APKs
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_APK: ${{ inputs.build_apk || false }}
          FORCE_FULL_VALIDATION: ${{ inputs.force_full_validation || false }}
        run: python3 tool/ci_validation.py
      - run: python3 -m unittest discover -s tool/tests -v
        if: steps.validation.outputs.full == 'true'
      - run: python3 -m pip install -r backend/requirements.txt
        if: steps.validation.outputs.full == 'true'
      - name: Prepare isolated PostgreSQL for encrypted Android clients
        if: steps.validation.outputs.full == 'true'
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://postgres:synthetic-ci-only-password@localhost:5432/lifeos_test',autocommit=True) as db:
              db.execute("CREATE ROLE lifeos_ci LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'synthetic-ci-only-password'")
              db.execute('GRANT CONNECT,CREATE ON DATABASE lifeos_test TO lifeos_ci')
          PY
      - run: python3 -m unittest discover -s backend/tests -v
        if: steps.validation.outputs.full == 'true'
      - run: PYTHONPATH=. python3 tool/check_sync_protocol.py
        if: steps.validation.outputs.full == 'true'
      - run: python3 tool/validate_packs.py --release
        if: steps.validation.outputs.full == 'true'
      - run: flutter analyze
        if: steps.validation.outputs.full == 'true'
      - run: flutter test test/domain_test.dart test/calendar_test.dart test/financial_period_test.dart test/backup_test.dart test/appearance_test.dart test/controller_test.dart test/widget_test.dart test/offline_finance_test.dart test/wealth_test.dart test/statement_import_test.dart test/personal_modules_test.dart test/ux_recovery_test.dart test/family_ux_test.dart test/ux31_test.dart test/launch_locales_test.dart test/finance_ux31_test.dart test/session_rotation_test.dart test/account_center_test.dart
        if: steps.validation.outputs.full == 'true'
      - run: flutter test --update-goldens test/visual_snapshot_test.dart test/offline_visual_test.dart test/account_center_visual_test.dart test/ux_recovery_visual_test.dart test/family_completion_visual_test.dart test/ux31_visual_test.dart
        if: steps.validation.outputs.full == 'true'
      - run: python3 tool/verify_account_screens.py
        if: steps.validation.outputs.full == 'true'
      - run: python3 tool/verify_goldens.py
        if: steps.validation.outputs.full == 'true'
      - uses: actions/upload-artifact@v4
        if: always() && steps.validation.outputs.full == 'true'
        with:
          name: lifeos-ui-screenshots-${{ github.run_number }}
          path: |
            test/goldens/*.png
            test/ux31_goldens/*.png
            test/control_goldens/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Compile native Android code without creating an APK
        if: steps.validation.outputs.full == 'true'
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Enable KVM for encrypted storage integration tests
        if: steps.validation.outputs.full == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: SQLCipher persistence, migrations and verified restore on Android emulator
        if: steps.validation.outputs.full == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: bash tool/check_android_family.sh
      - name: Save evidence after all mandatory validation succeeds
        if: steps.validation.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-validation-proof
          path: validation-proof.json
          retention-days: 90
          if-no-files-found: error
      - name: Reuse the verified single APK after test-only changes
        id: reuse
        if: steps.validation.outputs.build == 'true' && inputs.reuse_signed_apk == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/reuse_signed_apk.py
      - name: Build and verify one APK with the persistent test identity
        id: signing
        if: steps.validation.outputs.build == 'true' && inputs.reuse_signed_apk != true
        env:
          LIFEOS_TEST_KEYSTORE_BASE64: ${{ secrets.LIFEOS_TEST_KEYSTORE_BASE64 }}
          LIFEOS_API_ORIGIN: https://api.getuladim.space
        run: bash tool/ci_signing.sh
      - name: Download retained signed release for update verification
        if: steps.validation.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/check_release_upgrade.py --download
      - name: Install over signed 112001 and retain encrypted user data
        if: steps.validation.outputs.build == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 12
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          script: python3 tool/check_release_upgrade.py --candidate build/app/outputs/flutter-apk/app-release.apk
      - name: Save Android upgrade evidence
        if: always() && steps.validation.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: uladim-upgrade-evidence-${{ github.run_number }}
          path: upgrade_evidence/
          if-no-files-found: warn
      - name: Save public signing diagnostics on failure
        if: failure() && steps.validation.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-signing-diagnostics-${{ github.run_number }}
          path: apk-certificate.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload signed APK and public certificate evidence
        if: always() && (steps.signing.outcome == 'success' || steps.reuse.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-release-test-apk-${{ inputs.reuse_signed_apk && '6acbde34f499d7c740322687416abc3aa542f9ac' || steps.validation.outputs.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            apk-identity.txt
            apk-certificate.txt
            apk-manifest.txt
          if-no-files-found: error
          retention-days: 90

  upgrade_probe:
    if: inputs.upgrade_probe == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify retained signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/check_release_upgrade.py --download
      - name: Reuse exact signed APK134001 for acceptance without rebuilding
        if: inputs.reuse_signed_apk == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/reuse_signed_apk.py --output "$RUNNER_TEMP/uladim-candidate.apk"
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: bash tool/check_release_probe.sh "${{ inputs.reuse_signed_apk }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uladim-upgrade-probe-${{ github.run_number }}
          path: upgrade_evidence/
          if-no-files-found: warn
