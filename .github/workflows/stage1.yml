name: Stage 1 checks and UI screenshots
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tool/tests -v
      - run: python3 tool/validate_packs.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/prepare_platforms.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/domain_test.dart test/widget_test.dart
      - run: flutter test --update-goldens test/visual_snapshot_test.dart
      - run: python3 tool/verify_goldens.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifeos-ui-screenshots-${{ github.run_number }}
          path: test/goldens/*.png
          if-no-files-found: warn
          retention-days: 14
