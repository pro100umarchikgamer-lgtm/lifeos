name: Focused Android completion regression
on:
  push:
    branches: [feature/uladim-ux-recovery-launch]
    paths:
      - 'lib/**'
      - 'integration_test/offline_storage_test.dart'
      - '.github/workflows/android-regression.yml'
permissions:
  contents: read
concurrency:
  group: uladim-android-regression
  cancel-in-progress: false
jobs:
  android_completion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: bash tool/prepare_platforms.sh
      - run: flutter pub get
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real SQLCipher completion and UTC alias on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb -s emulator-5554 shell cmd alarm set-timezone Etc/UTC
            flutter test integration_test/offline_storage_test.dart -d emulator-5554
