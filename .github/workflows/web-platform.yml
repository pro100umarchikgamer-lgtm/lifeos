name: ULADIM Web client
on:
  pull_request:
    branches: [feature/uladim-hostinger-launch]
    paths: ['backend/webassets/**', 'backend/web.py', 'web-tests/**', 'package*.json', 'tool/check_web*.py', 'tool/check_pwa*.py', 'tool/check_finance_browser.py', 'tool/check_chart_theme.py', 'backend/tests/**', 'tool/check_web_dom.mjs', 'tool/serve_web_fixture.py', '.github/workflows/web-platform.yml', 'lighthouserc.cjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uladim-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lifeos_test
          POSTGRES_PASSWORD: synthetic-web-ci-admin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d lifeos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LIFEOS_TEST_DATABASE_URL: postgresql://lifeos_ci:synthetic-web-ci-only@localhost:5432/lifeos_test
      ULADIM_WEB_TEST_DATABASE_URL: postgresql://lifeos_ci:synthetic-web-ci-only@localhost:5432/lifeos_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -r tool/web-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Create isolated non-admin PostgreSQL role
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://postgres:synthetic-web-ci-admin@localhost:5432/lifeos_test',autocommit=True) as db:
              db.execute("CREATE ROLE lifeos_ci LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'synthetic-web-ci-only'")
              db.execute('GRANT CONNECT,CREATE ON DATABASE lifeos_test TO lifeos_ci')
          PY
      - name: Full backend tests including PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web_evidence
          python -m unittest discover -s backend/tests -v 2>&1 | tee web_evidence/backend-tests.log
      - name: DOM integration with actual server records
        run: python -m tool.check_web_dom
      - name: Product CRUD, both themes and four viewport widths
        run: python -m tool.check_web_platform
      - name: Existing PWA and financial acceptance
        run: |
          python -m tool.check_pwa_browser
          python -m tool.check_finance_browser
          python -m tool.check_web_browser
          python -m tool.check_registration_browser
          python -m tool.check_pwa_update
          python -m tool.check_chart_theme
      - name: Lighthouse on disposable local service
        run: |
          python -m tool.serve_web_fixture > /tmp/uladim-fixture.log 2>&1 &
          ready=0
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:8765/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/uladim-fixture.log; exit 1; fi
          npx lhci autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uladim-web-evidence
          path: |
            web_evidence/
            .lighthouseci/
          if-no-files-found: warn
          include-hidden-files: true
  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
