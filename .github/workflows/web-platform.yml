name: ULADIM Web client
on:
  pull_request:
    branches: [feature/uladim-hostinger-launch]
    paths: ['backend/webassets/**', 'backend/web.py', 'web-tests/**', 'package*.json', 'tool/check_web*.py', 'tool/check_web_dom.mjs', 'tool/serve_web_fixture.py', '.github/workflows/web-platform.yml', 'lighthouserc.cjs']
  push:
    branches: [work/uladim-web-platform]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uladim-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -r tool/web-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Shared API and static asset security
        run: python -m unittest backend.tests.test_pwa backend.tests.test_control_web
      - name: DOM integration with actual server records
        run: python -m tool.check_web_dom
      - name: Product CRUD, both themes and four viewport widths
        run: python -m tool.check_web_platform
      - name: Existing PWA and financial acceptance
        run: |
          python -m tool.check_pwa_browser
          python -m tool.check_finance_browser
          python -m tool.check_web_browser
      - name: Lighthouse on disposable local service
        run: |
          python -m tool.serve_web_fixture > /tmp/uladim-fixture.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://localhost:8765/ > /dev/null && break; sleep 1; done
          npx lhci autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uladim-web-evidence
          path: |
            web_evidence/
            .lighthouseci/
          if-no-files-found: warn
  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
