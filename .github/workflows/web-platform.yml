name: ULADIM Web client
on:
  pull_request:
    branches: [feature/uladim-hostinger-launch]
    paths: ['backend/webassets/**', 'backend/web.py', 'backend/account_lifecycle.py', 'web-tests/**', 'package*.json', 'tool/check_web*.py', 'tool/web_browser_navigation.py', 'tool/web_test_tls.py', 'tool/check_google_browser.py', 'tool/check_pwa*.py', 'tool/check_finance_browser.py', 'tool/check_chart_theme.py', 'tool/check_workspace_recovery.py', 'tool/check_statement*', 'backend/tests/**', 'tool/check_focus*', 'tool/check_workspace_switch_focus.py', 'tool/check_*_browser.py', 'tool/check_session_experience.py', 'tool/check_currency_picker.py', 'tool/test_publish_feedback_guard.py', 'deploy/hostinger/publish-focus-ui.sh', 'tool/verify_web_release.py', 'tool/check_web_dom.mjs', 'tool/serve_web_fixture.py', '.github/workflows/web-platform.yml', 'lighthouserc.cjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uladim-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    # This version matches tool/web-requirements.txt and includes all browser dependencies.
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lifeos_test
          POSTGRES_PASSWORD: synthetic-web-ci-admin
        options: >-
          --health-cmd "pg_isready -U postgres -d lifeos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LIFEOS_TEST_DATABASE_URL: postgresql://lifeos_ci:synthetic-web-ci-only@postgres:5432/lifeos_test
      ULADIM_WEB_TEST_DATABASE_URL: postgresql://lifeos_ci:synthetic-web-ci-only@postgres:5432/lifeos_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -r tool/web-requirements.txt
      - name: Create isolated non-admin PostgreSQL role
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://postgres:synthetic-web-ci-admin@postgres:5432/lifeos_test',autocommit=True) as db:
              db.execute("CREATE ROLE lifeos_ci LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'synthetic-web-ci-only'")
              db.execute('GRANT CONNECT,CREATE ON DATABASE lifeos_test TO lifeos_ci')
          PY
      - name: Full backend tests including PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web_evidence
          python -m unittest discover -s backend/tests -v 2>&1 | tee web_evidence/backend-tests.log
      - name: DOM integration with actual server records
        run: python -m tool.check_web_dom
      - name: Product CRUD, both themes and four viewport widths
        run: python -m tool.check_web_platform
      - name: Clarity hierarchy and selected-device revocation
        run: python -m tool.check_clarity_review
      - name: Owner feedback regressions
        run: |
          python -m tool.check_welcome_browser
          python -m tool.check_session_experience
          python -m tool.check_web_push_browser
          python -m tool.check_budget_input_browser
          python -m tool.check_currency_picker
          python -m tool.check_finance_views_browser
          python -m tool.check_mobile_today_browser
          python -m tool.check_transaction_categories
          python tool/test_publish_feedback_guard.py
      - name: Recorded feedback, inbox, safe Control recovery and public help
        run: |
          python -m tool.check_feedback_browser
          python -m tool.check_inbox_browser
          python -m tool.check_control_announcements_browser
          python -m tool.check_recovery_browser
          python -m tool.check_recovery_live_browser
          node tool/check_statement_accounts.cjs
          python -m tool.check_statement_accounts_browser
          python -m tool.check_notification_connection_browser
          python -m tool.check_context_help_browser
          python -m tool.check_public_help_browser
          python -m tool.check_download_release_browser
          python -m tool.check_account_deletion_browser
          python -m tool.check_account_deletion_live_browser
          python -m tool.check_account_deletion_google_browser
          python -m tool.check_google_only_security_browser
          python -m tool.check_optional_modules_browser
          python -m tool.check_erased_finance_browser
          python -m tool.check_privacy_erased_browser
      - name: Focus settings, refresh status and delayed workspace switching
        run: |
          python -m tool.check_focus_completion
          python -m tool.check_workspace_switch_focus
          python -m tool.check_focus_auth
          python -m tool.check_import_simple
      - name: Align Firefox home ownership inside the test container
        run: |
          if [ "$HOME" = /github/home ] && [ "$(stat -c %u "$HOME")" != "$(id -u)" ]; then
            chown "$(id -u):$(id -g)" "$HOME"
          fi
      - name: Workspace recovery in Chromium, WebKit and Firefox
        run: |
          for engine in chromium webkit firefox; do
            python -m tool.check_workspace_recovery --engine "$engine" --output "web_evidence/workspace-$engine"
          done
      - name: Save bank imports in Chromium, WebKit and Firefox
        run: |
          node tool/check_statement_formats.cjs
          for engine in chromium webkit firefox; do
            ULADIM_BROWSER="$engine" python -m tool.check_statement_browser
            python -m tool.check_statement_documents --engine "$engine"
          done
      - name: Existing PWA and financial acceptance
        run: |
          python -m tool.check_pwa_browser
          python -m tool.check_finance_browser
          python -m tool.check_web_browser
          python -m tool.check_registration_browser
          python -m tool.check_pwa_update
          python -m tool.check_chart_theme
      - name: Personal import, workspace persistence and help across browsers
        run: |
          for engine in chromium webkit firefox; do
            python -m tool.check_web_personal_import --engine "$engine" --output "web_evidence/personal-import-$engine"
          done
      - name: Lighthouse on disposable local service
        run: |
          python -m tool.serve_web_fixture > /tmp/uladim-fixture.log 2>&1 &
          ready=0
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:8765/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/uladim-fixture.log; exit 1; fi
          CHROME_PATH=$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(playwright.chromium.executable_path)
          PY
          ) npx lhci autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uladim-web-evidence
          path: |
            web_evidence/
            .lighthouseci/
          if-no-files-found: warn
          include-hidden-files: true
  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
