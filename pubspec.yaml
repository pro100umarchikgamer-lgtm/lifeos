name: lifeos
description: Offline-first personal and family organizer.
publish_to: none
version: 0.1.1+2
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_secure_storage: ^9.2.2
  sqflite_sqlcipher: ^3.1.0
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.5.1
  timezone: ^0.10.0
  cryptography: ^2.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/locales/
    - assets/migrations/
